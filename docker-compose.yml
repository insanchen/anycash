name: anycash

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anycash}
      POSTGRES_USER: ${POSTGRES_USER:-anycash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-anycash}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-anycash}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?set ACCESS_TOKEN_SECRET in .env}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?set REFRESH_TOKEN_SECRET in .env}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-900}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-2592000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@anycash.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-id}
      AUTH_RATE_LIMIT_PER_MIN: ${AUTH_RATE_LIMIT_PER_MIN:-20}
      API_RATE_LIMIT_PER_MIN: ${API_RATE_LIMIT_PER_MIN:-100}
      API_BURST_LIMIT: ${API_BURST_LIMIT:-20}
      EXCHANGE_RATE_PROVIDER: ${EXCHANGE_RATE_PROVIDER:-manual}
      EXCHANGE_RATE_API_KEY: ${EXCHANGE_RATE_API_KEY:-}
    ports:
      - "${APP_PORT:-8802}:3000"

volumes:
  pgdata:
